[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "multifat"
dynamic = ["version"]
description = "Multiaxial high-cycle fatigue criteria (critical-plane, invariant, integral and energy-based) evaluated on experimental datasets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Andrea Chiocca" }, { name = "Tommaso Grossi" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
    "scipy>=1.11",
]

[project.scripts]
multifat-calibrate = "multifat.cli.calibrate:main"
multifat-run = "multifat.cli.run:cli"
multifat-compare = "multifat.cli.compare:main"
multifat-pipeline = "multifat.cli.pipeline:main"

[project.urls]
Repository = "https://github.com/andreachiocca/multiaxial-fatigue"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff==0.14.2",
    "black==25.9.0",
]

[tool.hatch.version]
path = "src/multifat/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/multifat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
# Correctness-only rule set: unused imports, redefinitions, undefined names and
# syntax/comparison errors. Formatting is delegated to black.
select = ["E9", "F401", "F63", "F7", "F811", "F821", "F822", "F823"]
