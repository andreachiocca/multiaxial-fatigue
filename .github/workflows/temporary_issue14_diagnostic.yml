name: Temporary Issue 14 diagnostics and formatting
on:
  push:
    branches: [issue14/canonical-method-variants]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - name: Apply Black to changed Python files
        run: |
          uv run black src/multifat/cli/method_selection.py src/multifat/cli/pipeline.py src/multifat/cli/run.py src/multifat/eval/endurance.py tests/test_pipeline.py tests/test_endurance.py tests/test_method_variant_routing.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/multifat/cli/method_selection.py src/multifat/cli/pipeline.py src/multifat/cli/run.py src/multifat/eval/endurance.py tests/test_pipeline.py tests/test_endurance.py tests/test_method_variant_routing.py
            git commit -m "Apply repository Black formatting to method variant implementation"
            git push origin HEAD:issue14/canonical-method-variants
          fi
      - name: Capture full pytest failure summary
        id: diagnostics
        shell: bash
        run: |
          uv run pytest -q --tb=short --maxfail=12 > /tmp/issue14-pytest.log 2>&1
          status=$?
          printf 'PYTEST_EXIT=%s\n' "$status" >> "$GITHUB_ENV"
          tail -n 105 /tmp/issue14-pytest.log > /tmp/issue14-summary.log
          cat /tmp/issue14-summary.log
          exit 0
      - name: Post issue 14 diagnostic on PR 26
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/issue14-summary.log ]; then
            {
              echo 'Temporary diagnostic for Issue #14 method-variant PR. The relevant summary follows.'
              echo
              echo '~~~text'
              cat /tmp/issue14-summary.log
              echo '~~~'
            } > /tmp/issue14-comment.md
          else
            printf '%s\n' 'Issue #14 diagnostic step did not complete. See the workflow steps.' > /tmp/issue14-comment.md
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/26/comments" --method POST -F body=@/tmp/issue14-comment.md || true
