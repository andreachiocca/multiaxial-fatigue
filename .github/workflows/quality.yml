name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run python tools/generate_method_docs.py --check
      - run: uv run python tools/generate_workbook_docs.py --check
      - run: uv run python tools/check_docs.py
      - run: uv run python tools/check_scientific_reviews.py
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            python-version: '3.12'
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest
      - name: Console entry points resolve
        run: |
          uv run multifat-run --help
          uv run multifat-compare --help
          uv run multifat-pipeline --help
