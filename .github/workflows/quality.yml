name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run python tools/generate_method_docs.py --check
      - run: uv run python tools/generate_workbook_docs.py --check
      - run: uv run python tools/check_docs.py
      - run: uv run python tools/check_scientific_reviews.py
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            python-version: '3.12'
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest
      - name: Console entry points resolve
        run: |
          uv run multifat-run --help
          uv run multifat-compare --help
          uv run multifat-pipeline --help

  diagnose:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - name: Capture failing pytest tracebacks
        shell: bash
        run: |
          set +e
          uv run pytest tests/test_dataset_overlays.py tests/test_dataset_import.py -q --tb=short --maxfail=8 > pytest-diagnostic.log 2>&1
          code=$?
          echo "DIAGNOSTIC_TEST_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Report exact failures on the pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path
          output = Path("pytest-diagnostic.log").read_text(encoding="utf-8", errors="replace")
          tail = output[-15000:]
          body = ("CI diagnostic for data-import tests on Python 3.12. Exit code "
                  + os.environ.get("DIAGNOSTIC_TEST_EXIT_CODE", "unknown")
                  + ". Temporary diagnostic job.\n\n"
                  + "```text\n" + tail + "\n```")
          repo = os.environ["GITHUB_REPOSITORY"]
          number = os.environ["PR_NUMBER"]
          url = f"https://api.github.com/repos/{repo}/issues/{number}/comments"
          data = json.dumps({"body":body}).encode("utf-8")
          request = urllib.request.Request(url, data=data, method="POST",
              headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "User-Agent": "multifat-ci-diagnostics",
                       "Content-Type": "application/json"})
          with urllib.request.urlopen(request, timeout=30) as response:
              print("Posted CI diagnostics", response.status, len(body))
          PY
