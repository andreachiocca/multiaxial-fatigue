name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run python tools/generate_method_docs.py --check
      - run: uv run python tools/generate_workbook_docs.py --check
      - run: uv run python tools/check_docs.py
      - run: uv run python tools/check_scientific_reviews.py
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            python-version: '3.12'
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest
      - name: Console entry points resolve
        run: |
          uv run multifat-run --help
          uv run multifat-compare --help
          uv run multifat-pipeline --help

  diagnose:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - name: Capture failing pytest tracebacks
        shell: bash
        run: |
          set +e
          uv run pytest -q --tb=short --maxfail=12 > pytest-diagnostic.log 2>&1
          code=$?
          echo "DIAGNOSTIC_TEST_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Report exact failures on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          output = Path("pytest-diagnostic.log").read_text(encoding="utf-8", errors="replace")
          tail = output[-18000:]
          body = ("Temporary CI diagnostic on Python 3.12. Exit code "
                  + os.environ.get("DIAGNOSTIC_TEST_EXIT_CODE", "unknown")
                  + ". The diagnostic workflow step will be removed after triage.\n\n"
                  + "```text\n" + tail + "\n```")
          Path("diagnostic-comment.json").write_text(json.dumps({"body": body}), encoding="utf-8")
          PY
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -X POST --input diagnostic-comment.json
