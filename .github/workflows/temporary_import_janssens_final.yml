name: Temporary import of final Janssens workbook
on:
  push:
    branches: [fix/summary-fatigue-limits-ratio]
    paths:
      - tools/aisi316l_final_delta.b64
      - .github/workflows/temporary_import_janssens_final.yml
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'andreachiocca/multiaxial-fatigue'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/summary-fatigue-limits-ratio
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - name: Install author-corrected workbook and update dependent data
        shell: bash
        run: |
          uv run python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          from pathlib import Path
          import zipfile
          import zlib
          from openpyxl import load_workbook

          from multifat.imp import overlays
          from multifat.imp.experimental_data import load_material_workbook
          from multifat.report.subsets import dataset_fingerprint

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          old_sha = 'b637deefb415243c5a071a38f188c02202501d2c6e85b87c30af41523a211949'
          final_source_sha = 'a70a09f76fb8fa22f0d6ef9843512eefd20db8fae980639067ef6d207187a35a'
          book_path = Path('Experimental_Data/8_AISI316L.xlsx')
          overlay_path = Path('src/multifat/imp/overlay_files/8_AISI316L.overlay.json')
          original = book_path.read_bytes()
          assert sha(original) == old_sha, 'The AISI workbook differs from the verified PR #23 base'
          patches = json.loads(zlib.decompress(base64.b64decode(
              Path('tools/aisi316l_final_delta.b64').read_text(encoding='ascii').strip())))
          output = io.BytesIO()
          with zipfile.ZipFile(io.BytesIO(original)) as source, zipfile.ZipFile(output, 'w') as target:
              for info in source.infolist():
                  value = source.read(info.filename)
                  if info.filename in patches:
                      record = patches[info.filename]
                      for start, end, payload in reversed(record['edits']):
                          value = value[:start] + base64.b64decode(payload) + value[end:]
                      assert sha(value) == record['sha'], info.filename
                  target.writestr(info, value)
          new_bytes = output.getvalue()
          with zipfile.ZipFile(io.BytesIO(new_bytes)) as reconstructed:
              assert reconstructed.testzip() is None
          wb = load_workbook(io.BytesIO(new_bytes), data_only=True)
          summary, data = wb['Summary'], wb['Dataset']
          assert summary['I2'].value == 278.5 and summary['J2'].value == 144
          assert data['E2'].value == 17225000 and data['F2'].value == 'Yes'
          assert all(data[f'T{r}'].value == 90 for r in range(18, 29))

          overlay = json.loads(overlay_path.read_text(encoding='utf-8'))
          assert overlay['base_sha256'] == old_sha
          assert len(overlay['operations']) == 26
          redundancies = [op for op in overlay['operations']
              if op['op'] == 'set_case'
              and op.get('field') == 'Phase TORSIONAL load (\u00b0)'
              and op.get('authors') == 'Janssens'
              and op.get('specimen', '').startswith('Non_prop_')]
          assert len(redundancies) == 11
          assert all(op['from'] == 0 and op['to'] == 90 for op in redundancies)
          overlay['operations'] = [op for op in overlay['operations'] if op not in redundancies]
          overlay['base_sha256'] = sha(new_bytes)

          # Import with the real production code; do not invent or hard-code a fingerprint.
          import tempfile
          with tempfile.TemporaryDirectory() as tmp:
              temporary = Path(tmp)
              (temporary / book_path.name).write_bytes(new_bytes)
              temporary_overlay = temporary / 'overlays'
              temporary_overlay.mkdir()
              (temporary_overlay / overlay_path.name).write_text(json.dumps(overlay), encoding='utf-8')
              previous_dir = overlays.OVERLAY_DIR
              try:
                  overlays.OVERLAY_DIR = temporary_overlay
                  overlays._overlays_by_base_hash.cache_clear()
                  block = load_material_workbook(temporary / book_path.name)['AISI316L']
              finally:
                  overlays.OVERLAY_DIR = previous_dir
                  overlays._overlays_by_base_hash.cache_clear()
          assert len(block['cases']) == 39 and len(block['runouts']) == 13
          assert block['material']['Tensile_fatigue_limit_MPa'] == 278.5
          assert block['material']['Torsional_fatigue_limit_MPa'] == 144
          assert block['material']['E_MPa'] == 193000 and block['material']['nu'] == 0.3
          assert block['overlay']['operations'] == 15
          fingerprint = dataset_fingerprint(block)
          overlay['expected_fingerprint'] = fingerprint

          # Every substantive difference originates in the author-supplied file.
          importer_tests = Path('tests/test_dataset_import.py')
          test_source = importer_tests.read_text(encoding='utf-8')
          assert test_source.count('    ) == (241, 144)') == 1
          importer_tests.write_text(test_source.replace('    ) == (241, 144)',
              '    ) == (278.5, 144)'), encoding='utf-8')

          provenance_path = Path('Experimental_Data/PROVENANCE.md')
          provenance = provenance_path.read_text(encoding='utf-8')
          heading = '## AISI316L.xlsx\n'
          assert provenance.count(heading) == 1
          note = (
              '\n**Janssens final revision, supplied 28 October 2026.** '
              'The final author workbook (`8_AISI316L(1).xlsx`, original SHA-256 '
              f'`{final_source_sha}`) replaces the previous revision. '
              'Its reported R = -1 tensile fatigue limit is 278.5 MPa (previously 241); '
              'the torsional limit remains 144 MPa. Its first uniaxial run-out is '
              '17,225,000 cycles (previously 11,000,000), and non-proportional '
              'torsional phases in Dataset rows 18-28 are now 90 degrees. '
              'The Summary averages and derived values are also updated. '
              'All underlying ZIP members of the workbook are preserved verbatim, '
              'although the repository copy is recompressed at ZIP-container level. '
              f'The repository XLSX SHA-256 is `{sha(new_bytes)}`. '
              'Because the 11 phase corrections are now part of the source, the active '
              'overlay has 15 remaining operations. '
              f'The new post-overlay fingerprint is `{fingerprint}` '
              '(39 failure observations and 13 run-outs). The previous overlay '
              'mapping remains in the historical overlay JSON. No other '
              'experimental workbooks are changed.\n\n')
          provenance_path.write_text(provenance.replace(heading, heading + note, 1),
              encoding='utf-8')
          docs_path = Path('docs/dataset-workflow.md')
          docs = docs_path.read_text(encoding='utf-8')
          docs = docs.replace(
              'Source-row selection currently yields 241 and 144 MPa, but the newly uploaded Dataset contains corrected Janssens axial stresses while the Summary is unchanged.',
              'The final author-supplied Summary reports 278.5 and 144 MPa at R = -1; the experimental observations and phase shifts are corrected in this final source.')
          docs_path.write_text(docs, encoding='utf-8')
          checkpoint_path = Path('docs/audit-checkpoint.md')
          checkpoint = checkpoint_path.read_text(encoding='utf-8')
          checkpoint = checkpoint.replace('# Development continuation checkpoint\n',
              '# Development continuation checkpoint\n\n'
              '## Janssens final workbook (28 October 2026)\n\n'
              'The final author-supplied AISI316L workbook replaces the previous file. '
              'The R = -1 tensile fatigue limit is 278.5 MPa, the first uniaxial run-out '
              'is 17,225,000 cycles, and the non-proportional torsional phases are 90 degrees. '
              'The overlay has been reduced to 15 independent operations. '
              f'The updated dataset fingerprint is `{fingerprint}`. '
              'Older checkpoint notes describe superseded source revisions.\n\n', 1)
          checkpoint_path.write_text(checkpoint, encoding='utf-8')
          book_path.write_bytes(new_bytes)
          overlay_path.write_text(json.dumps(overlay, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8')
          print('Final source SHA-256:', final_source_sha)
          print('Repository ZIP SHA-256:', sha(new_bytes))
          print('Recomputed fingerprint:', fingerprint)
          print('Overlay operations:', len(overlay['operations']))
          PY
      - name: Verify importer and full tests
        run: |
          uv run pytest tests/test_dataset_overlays.py tests/test_dataset_import.py -q
          uv run pytest -q
      - name: Commit reviewed final workbook to PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Experimental_Data/8_AISI316L.xlsx Experimental_Data/PROVENANCE.md src/multifat/imp/overlay_files/8_AISI316L.overlay.json tests/test_dataset_import.py docs/dataset-workflow.md docs/audit-checkpoint.md
          git diff --cached --quiet && { echo 'No change'; exit 1; }
          git commit -m 'Integrate final Janssens AISI316L workbook and reconcile overlay'
          git push origin HEAD:fix/summary-fatigue-limits-ratio
