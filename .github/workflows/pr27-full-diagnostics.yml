name: Temporary PR27 test traceback capture

on:
  push:
    branches:
      - fix/tveit2025-stage1-pr21-integration

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Run entire pytest suite and record failures
        run: |
          set +e
          uv run pytest -q --tb=short > /tmp/pr27-full-output.txt 2>&1
          status=$?
          {
            echo "Full pytest exit status: ${status}"
            echo "Git commit: $(git rev-parse HEAD)"
            echo
            tail -n 500 /tmp/pr27-full-output.txt
          } > pr27-full-test-diagnostics.txt
          exit 0
      - name: Publish traceback on PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr27-full-test-diagnostics.txt
          git commit -m "Temporary PR27 full test diagnostic output"
          git push origin HEAD:fix/tveit2025-stage1-pr21-integration
